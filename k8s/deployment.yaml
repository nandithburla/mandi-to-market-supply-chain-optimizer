apiVersion: apps/v1
kind: Deployment
metadata:
  name: mandi-to-market-optimizer
  labels:
    app: mandi-to-market
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mandi-to-market
  template:
    metadata:
      labels:
        app: mandi-to-market
        tier: web
    spec:
      containers:
        - name: mandi-to-market-app
          image: <AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/mandi-to-market-optimizer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              value: "8000"
            - name: HOST
              value: "0.0.0.0"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mandi-to-market-secrets
                  key: OPENROUTER_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
